<!DOCTYPE html>
<html>

<head>
    <title>Chatbot</title>

    <style>
        body {
            font-family: Arial;
            margin-top: 0px;
            margin-bottom: 0px;
        }

        .send-button {
            background-color: rgb(25, 135, 84);
            color: white;
            padding: 12px 20px;
            margin-left: 10px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
        }

        .chat-input {
            padding: 12px 15px;
            border-radius: 10px;
            border-width: 1px;
            font-size: 15px;
            flex-grow: 1;
        }

        .chat-input-container {
            display: flex;
            margin-bottom: 60px;
        }

        .app-container {
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .chat-message-user {
            display: flex;
            justify-content: end;
            align-items: start;
        }

        .chat-message-robot {
            display: flex;
            align-items: start;
        }

        .chat-message-text {
            background-color: rgb(238, 238, 238);
            padding: 15px 20px;
            border-radius: 10px;
            margin-right: 10px;
            margin-left: 10px;
            margin-bottom: 20px;
            max-width: 300px;
        }

        .chat-message-profile {
            width: 45px;
        }

        .chat-messages-container {
            flex-grow: 1;
            margin-top: 20px;
            overflow: scroll;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .welcome-message {
            color: rgb(120, 120, 120);
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="js-container"></div>

    <!-- I use supersimpledev react to use the same version of react in his course. -->
    <!-- In real projects. i will use the latest version of real react -->
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <!-- Simon's provided external library (Chatbot) -->
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <!-- Babel will translate our JSX into regular JavaScript -->
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script type="text/babel">

        function ChatInput({ chatMessages, setChatMessages }) {
            const [inputText, setInputText] = React.useState('');
            const [isLoading, setIsLoading] = React.useState(false);

            function saveInputText(event) {
                setInputText(event.target.value);
            }

            async function sendMessage() {
                const newChatMessages = [
                    ...chatMessages,
                    { message: inputText, sender: 'user', id: crypto.randomUUID() },
                    { message: 'loading...', sender: 'robot', id: 'loadingId' }
                ];
                setChatMessages(newChatMessages);
                // Instead using if-statement. we set it to true first because this function is Async.
                setIsLoading(true);

                // After the user sent a message. we can remove now the value of an input
                setInputText('');

                // Bot response
                const response = await Chatbot.getResponseAsync(inputText);

                // After received the response. need to change the last index of the array
                // and rerender again by setting the state again (setChatMessages)
                newChatMessages[newChatMessages.length - 1] = {
                    message: response,
                    sender: 'robot',
                    id: crypto.randomUUID()
                }

                // we need spread operator to copy the value of newChatMessages and
                // paste the value to the new created array.
                setChatMessages([...newChatMessages]);
                // Sorry for my grammar. I'm weak at english

                // after everything is done. set it again into false.
                setIsLoading(false);
            }

            function handleSendButton(event) {
                if (event.key === 'Enter') {
                    sendMessage();
                } else if (event.key === 'Escape') {
                    setInputText('');
                }
            }

            return (
                <div className="chat-input-container">
                    {isLoading ?
                        <input
                            placeholder="Bot is thinking."
                            size="30"
                            value={inputText}
                            disabled={true}
                            className="chat-input"
                        /> :
                        <input
                            placeholder="Send a message to a Chatbot"
                            size="30"
                            value={inputText}
                            onChange={saveInputText}
                            onKeyDown={handleSendButton}
                            className="chat-input"
                        />
                    }
                    {isLoading
                        ?
                        <button className="send-button">Wait</button>
                        :
                        <button onClick={sendMessage} className="send-button">Send</button>
                    }
                </div>
            );
        }

        function ChatMessages({ chatMessages, setChatMessages }) {
            return (
                <div className="chat-messages-container">
                    {chatMessages.map((chatMessage) => {
                        return (
                            <ChatMessage
                                message={chatMessage.message}
                                sender={chatMessage.sender}
                                key={chatMessage.id}
                            />
                        );
                    })}
                </div>
            );
        }

        function ChatMessage({ message, sender }) {
            return (
                <div className={sender === 'user'
                    ? 'chat-message-user'
                    : 'chat-message-robot'
                }>
                    {sender === 'robot' && <img src="robot.png" className="chat-message-profile" />}
                    <div className="chat-message-text">
                        {message}
                    </div>
                    {sender === 'user' && <img src="user.png" className="chat-message-profile" />}
                </div>
            );
        }

        function EmptyMessageGreet() {
            return (
                <p className="welcome.message">
                    Welcome to the chatbot project! Send a message using the textbox below.
                </p>
            )
        }

        // Main Components
        function App() {
            const [chatMessages, setChatMessages] = React.useState([]);

            return (
                <div className="app-container">
                    <ChatMessages
                        chatMessages={chatMessages}
                        setChatMessages={setChatMessages}
                    />
                    {chatMessages.length === 0 &&
                        <EmptyMessageGreet />
                    }
                    <ChatInput
                        chatMessages={chatMessages}
                        setChatMessages={setChatMessages}
                    />

                </div>
            );
        }

        const container = document.querySelector('.js-container');
        const root = ReactDOM.createRoot(container);

        root.render(<App />);
    </script>
</body>

</html>
