<!DOCTYPE html>
<html>

<head>
    <title>Chatbot</title>
</head>

<body>
    <div class="js-container"></div>

    <!-- I use supersimpledev react to use the same version of react in his course. -->
    <!-- In real projects. i will use the latest version of real react -->
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <!-- Babel will translate our JSX into regular JavaScript -->
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script type="text/babel">

        function ChatInput() {
            return (
                <>
                    <input placeholder="Send a message to a Chatbot" size="30" />
                    <button>Send</button>
                </>
            );
        }

        function ChatMessage(properties) {
            // The parameter of the components is the object of the components. to add properties. just add attribute to the component when you use it.
            const message = properties.message;
            const sender = properties.sender;

            return (
                <div>
                    {sender === 'user' && <img src="user.png" width="50" />}
                    {message}
                    {sender === 'robot' && <img src="robot.png" width="50" />}
                </div>
            );
        }

        // Main Components
        function App() {
            return (
                <div>
                    <ChatInput />
                    <ChatMessage message="hello" sender="user" />
                    <ChatMessage message="Hello! How can I help you?" sender="robot" />
                    <ChatMessage message="Make a Flipacoin using javascript" sender="user" />
                    <ChatMessage message="alright! sure!" sender="robot" />
                </div>
            );
        }

        const container = document.querySelector('.js-container');
        const root = ReactDOM.createRoot(container);

        root.render(<App />);
    </script>
</body>

</html>
