<!DOCTYPE html>
<html>

<head>
    <title>React Lesson 4a</title>
    <style>
        .toggle-button {
            color: white;
            border-radius: 7px;
            border: none;
            padding: 9px 15px;
            cursor: pointer;
        }

        .on-button {
            background-color: rgb(25, 135, 84);
        }

        .off-button {
            background-color: rgb(220, 53, 69);
        }
    </style>
</head>

<body>
    <div class="js-container"></div>

    <!-- I use supersimpledev react to use the same version of react in his course. -->
    <!-- In real projects. i will use the latest version of real react -->
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <!-- Babel will translate our JSX into regular JavaScript -->
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script type="text/babel">
        function Button() {
            const [isButtonOn, setButton] = React.useState(false);

            function toggleButton() {
                // As you can see. i set it to not operator because we need to
                // Change it to opposite value instead using if statement/ternary
                // operator
                setButton(!isButtonOn);
            }

            return (
                <>
                    <button
                        className={
                            isButtonOn
                                ? "toggle-button on-button"
                                : "toggle-button off-button"
                        }
                        onClick={toggleButton}
                    >
                        {isButtonOn ? "ON" : "OFF"}
                    </button>
                </>
            );
        }

        function App() {
            return (
                <>
                    <Button />
                </>
            );
        }

        const container = document.querySelector('.js-container');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>

</html>
