<!DOCTYPE html>
<html>

<head>
    <title>React Lesson 4h</title>
</head>

<body>
    <div class="js-container"></div>

    <!-- I use supersimpledev react to use the same version of react in his course. -->
    <!-- In real projects. i will use the latest version of real react -->
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <!-- Babel will translate our JSX into regular JavaScript -->
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script type="text/babel">
        function App() {
            // First we save the argument in count variables by using deconstructing.
            const [count, setCount] = React.useState(0);

            // we use useRef hooks to get the element of the button
            const buttonElem = React.useRef(null);

            function addCount() {
                // To change the value of count. we need to use the setCount function. and pass the new value of count in it.
                setCount(count + 1);
            }

            function resetCount() {
                setCount(0);
            }

            // This is the best way for me to implement the proper message for the button.
            // by using if statement to check the value of count and display the proper message for it.
            let clickMessage = '';

            if (count === 0) {
                clickMessage = "Not Clicked";
            } else if (count === 1) {
                clickMessage = "Clicked 1 time";
            } else {
                clickMessage = `Clicked ${count} times`;
            }

            let autoClickInterval;

            // I think it's optional for this exercise to stop the auto clicking so i will not do it.
            function autoClick() {
                setInterval(() => {
                    buttonElem.click();
                }, 1000);
            }

            return (
                <>
                    <button
                        onClick={addCount}
                        className="count-button"
                        ref={buttonElem}
                    >{clickMessage}</button>
                    <button onClick={resetCount}>Reset</button>
                    <button>Auto Click</button>
                </>
            );
        }

        const container = document.querySelector('.js-container');
        const root = ReactDOM.createRoot(container);

        root.render(<App />);
    </script>
</body>

</html>
