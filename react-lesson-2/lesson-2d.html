<!DOCTYPE html>
<html>

<head>
    <title>React Lesson 2d</title>
</head>

<body>
    <div class="js-container"></div>

    <!-- I use supersimpledev react to use the same version of react in his course. -->
    <!-- In real projects. i will use the latest version of real react -->
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <!-- Babel will translate our JSX into regular JavaScript -->
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
        function App() {
            return (
                // In the lesson. the email and password input must be in aligned by row
                // so i seperate that into two components. but in real projects. 
                // I think i will use css instead to align them by row and keep them in the 
                // same component.
                <>
                    <p>Hello, Welcome to my website</p>
                    <LoginForm />
                </>
            );
        }

        function EmailInput() {
            return (
                <div>
                    <input type="text" placeholder="Email" />
                </div>
            );
        }

        function PasswordInput() {
            return (
                <div>
                    <input type="password" placeholder="Password" />
                </div>
            );
        }

        function LoginForm() {
            return (
                <>
                    <EmailInput />
                    <PasswordInput />
                    <button>Login</button>
                    <button>Sign up</button>
                </>
            );
        }

        /*
        It is better to render the component directly<App /> instead of creating variables.
        const app = (
            <>
                <App />
            </>
        );
        */

        const container = document.querySelector('.js-container');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>

</html>
