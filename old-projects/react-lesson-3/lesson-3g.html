<!DOCTYPE html>
<html>

<head>
    <title>React Lesson 3g</title>
</head>

<body>
    <div class="js-container"></div>

    <!-- I use supersimpledev react to use the same version of react in his course. -->
    <!-- In real projects. i will use the latest version of real react -->
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <!-- Babel will translate our JSX into regular JavaScript -->
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script type="text/babel">
        function InputName() {
            const [inputName, setInputName] = React.useState('');

            // In react. we can't literally return the value of the inpunt.
            // So the best way is use State to save the value of the input in varlable
            // then use it in components
            function getInputValue(event) {
                setInputName(event.target.value);
            }

            return (
                <>
                    <input onChange={getInputValue} placeholder="Type a name here" />
                    <p>Hello {inputName}</p>
                </>
            );
        }


        // Main Components
        function App() {
            return (
                <>
                    <InputName />
                </>
            );
        }

        const container = document.querySelector('.js-container');
        const root = ReactDOM.createRoot(container);

        root.render(<App />);
    </script>
</body>

</html>
