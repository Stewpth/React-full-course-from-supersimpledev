<!DOCTYPE html>
<html>

<head>
    <title>React Lesson 4g</title>
</head>

<body>
    <div class="js-container"></div>

    <!-- Import DayJS -->
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>

    <!-- I use supersimpledev react to use the same version of react in his course. -->
    <!-- In real projects. i will use the latest version of real react -->
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <!-- Babel will translate our JSX into regular JavaScript -->
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script type="text/babel">
        function App() {
            const [time, setTime] = React.useState(
                dayjs().format('HH:mm:ss')
            );

            React.useEffect(() => {
                const timer = setInterval(() => {
                    setTime(dayjs().format('HH:mm:ss'));
                    // When you test the useEffect 
                    // without dependency array. you will notice
                    // that it will runs a lot more often
                    console.log('run code');
                }, 1000);
            });

            return (
                <p>Current time: {time}</p>
            )
        }

        const container = document.querySelector('.js-container');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>

</html>
