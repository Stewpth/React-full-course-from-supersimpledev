<!DOCTYPE html>
<html>

<head>
    <title>React Lesson 1c</title>
</head>

<body>
    <div class="js-container"></div>

    <!-- I use supersimpledev react to use the same version of react in his course. -->
    <!-- In real projects. i will use the latest version of real react -->
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <!-- Babel will translate our JSX into regular JavaScript -->
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
        const productName = <p>Cotton socks</p>;
        const productPrice = 10;
        const paragraph = <p>Price: ${productPrice}</p>;
        const addToCartButton = <button>Add to cart</button>;

        // I combined the variables in one element. i dont think this is a good practice.
        // i just want to try this. in javascript i will not use variables to create elements.
        const div = (
            <div>
                {productName}
                {paragraph}
                {addToCartButton}
            </div>
        );

        const container = document.querySelector('.js-container');
        ReactDOM.createRoot(container).render(div);
    </script>
</body>

</html>
